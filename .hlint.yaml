# DESIGN.md §2.5–§2.6.

# hlint does not read cabal's default-extensions. Without these it parses
# r.field as composition and #label as a syntax error.
- arguments: [-XGHC2024, -XOverloadedRecordDot, -XOverloadedStrings, -XOverloadedLabels]

# §2.6's layering, enforced. `within` is an allow-list, lists union across rules
# naming the same module, `Foo.*` is one component and `Foo.**` is `Foo` and
# all descendants, and bare `Foo` does not match `Foo.Bar`. The rules are by
# module name, so they span packages; `Main` is not trusted with anything,
# because tendril-demo's Main and canopy's are the same name. lint/fixtures/
# checks each rule (lint/check-layering.sh).
- modules:
    # 1. The raw ghostty binding is private to the high-level one, and its tests.
    - name: Ghostty.FFI.**
      within: [Ghostty.FFI.**, Ghostty.Effectful.**, Test.Ghostty.**]

    # 2. Tendril does not see ghostty: only canopy, tests and benchmarks do.
    #    Test.** is tendril's test-only oracle edge (§1.3).
    - name: Ghostty.Effectful.**
      within: [Ghostty.Effectful.**, Canopy.**, Test.**, Bench.**]

    # 3. The PTY shim is private to the PTY module.
    - name: Canopy.Ffi.**
      within: [Canopy.Ffi.**, Canopy.Child.Pty]

    # 4. The pure core (Canopy.App.Model, .Update, .Event, .Command) does no IO:
    #    these are allowed everywhere *except* there. hlint has only allow-lists,
    #    so "everywhere else" is spelled out; a new top-level Canopy.* subtree
    #    that needs one of them is added here. The core may import
    #    TreeSitter.Tree, .Node and .Query, which are pure (§5B.2).
    - name: [Canopy.Child.**, Canopy.Lsp.Transport, Canopy.Syntax.GrammarStore,
             TreeSitter.Parse, Effectful.Concurrent.**]
      within: [Canopy, Canopy.App.Run, Canopy.App.Interpret, Canopy.App.View,
               Canopy.Child.**, Canopy.Cli, Canopy.Config.**, Canopy.Intel.**,
               Canopy.Lsp.**, Canopy.Optics, Canopy.Profile.**, Canopy.Serve,
               Canopy.Session.**, Canopy.Syntax.**, Canopy.Units, Canopy.Watch,
               Ghostty.**, Tendril.**, TreeSitter.**, Test.**, Bench.**]

    # 5. The raw tree-sitter binding is private to the high-level one and its
    #    tests; the one unsafe module is private to the high-level one.
    - name: TreeSitter.FFI.**
      within: [TreeSitter.**, Test.TreeSitter.**]
    - name: TreeSitter.Internal.Pure
      within: [TreeSitter.**]

    # 6. lsp-types' lenses: only qualified, only as L, only in the LSP modules.
    - name: Language.LSP.Protocol.Lens
      as: L
      asRequired: true
      importStyle: qualified
      qualifiedStyle: post
      within: [Canopy.Lsp.**, Canopy.Intel.**]

    # 7. The house uses optics (§2.7).
    - name: Control.Lens.**
      within: []
